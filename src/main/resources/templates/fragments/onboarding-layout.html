<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:fragment="commonAssets(pageTitle)">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title th:text="${pageTitle}">Incorporación</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
        <link rel="stylesheet" th:href="@{/css/onboarding.css}">
    </th:block>
</head>
<body>
<th:block th:fragment="sidebar">
    <aside class="col-12 col-lg-2 onboarding-sidebar">
        <div class="card border-0 shadow-sm rounded-4 h-100">
            <div class="card-body p-3">
                <small class="text-muted fw-semibold d-block mb-2">INCORPORACIÓN TCB</small>
                <nav class="nav flex-column sidebar-nav">
                    <a class="nav-link" href="#"><i class="bi bi-house-door me-2"></i>Inicio</a>
                    <a class="nav-link d-flex align-items-center"
                       th:href="@{/onboarding/1}"
                       id="incorporacionToggle"
                       aria-expanded="true">
                        <span><i class="bi bi-ui-checks-grid me-2"></i>Alta de Persona</span>
                    </a>
                    <a class="nav-link"
                       id="sidebarCuentas"
                       th:href="@{/onboarding/apertura-cuenta/detalle}">
                        <i class="bi bi-wallet2 me-2"></i>Cuentas
                    </a>
                    <a class="nav-link" href="#"><i class="bi bi-arrow-left-right me-2"></i>Transferencias</a>
                    <a class="nav-link" href="#"><i class="bi bi-credit-card me-2"></i>Tarjetas</a>
                    <a class="nav-link" href="#"><i class="bi bi-coin me-2"></i>Pagos</a>
                    <a class="nav-link" href="#"><i class="bi bi-gear me-2"></i>Configuración</a>
                    <a class="nav-link" href="#"><i class="bi bi-headset me-2"></i>Soporte</a>
                </nav>
                <script>
                    (function () {
                        function syncSidebarActive() {
                            const path = window.location.pathname || "";
                            const altaPersona = document.getElementById("incorporacionToggle");
                            const cuentas = document.getElementById("sidebarCuentas");

                            if (!altaPersona || !cuentas) {
                                return;
                            }

                            altaPersona.classList.remove("active");
                            cuentas.classList.remove("active");

                            if (path.indexOf("/onboarding/apertura-cuenta") === 0) {
                                cuentas.classList.add("active");
                                return;
                            }

                            if (path.indexOf("/onboarding/") === 0) {
                                altaPersona.classList.add("active");
                            }
                        }

                        if (document.readyState === "loading") {
                            document.addEventListener("DOMContentLoaded", syncSidebarActive);
                        } else {
                            syncSidebarActive();
                        }
                    })();
                </script>
            </div>
        </div>
    </aside>
</th:block>

<th:block th:fragment="topbar">
    <header class="card border-0 shadow-sm rounded-4 mb-3 mb-lg-4 topbar-header">
        <div class="card-body d-flex flex-wrap align-items-center gap-3 py-3">
            <img th:src="@{/img/Logo_Banco_del_Bienestar2025.png}" class="topbar-logo" alt="Banco del Bienestar">
            <div class="topbar-actions ms-auto d-flex align-items-center gap-2">
                <i class="bi bi-bell"></i>
                <span class="avatar">JD</span>
            </div>
        </div>
    </header>
</th:block>

<th:block th:fragment="moduleTabs(activeTab)">
    <ul class="nav nav-tabs module-nav-tabs mb-1 mb-lg-2">
        <li class="nav-item">
            <a th:class="${activeTab == 'nueva-alta'} ? 'nav-link active' : 'nav-link text-brand'" th:href="@{/}">
                <i class="bi bi-file-earmark-plus me-1"></i>Nueva Alta
            </a>
        </li>
        <!--li-- class="nav-item">
            <a th:class="${activeTab == 'relacionar-personas'} ? 'nav-link active' : 'nav-link text-brand'" th:href="@{/onboarding/relacionar-personas}">
                <i class="bi bi-people-fill me-1"></i>Relacionar personas
            </a>
        </li-->
        <!--li class="nav-item">
            <a th:class="${activeTab == 'apertura-cuenta'} ? 'nav-link active' : 'nav-link text-brand'" th:href="@{/onboarding/apertura-cuenta}">
                <i class="bi bi-bank2 me-1"></i>Apertura de cuenta
            </a>
        </li-->
    </ul>
</th:block>

<th:block th:fragment="fixedBackAction">
    <div class="page-fixed-actions">
        <div class="action-row">
            <a class="btn btn-outline-dark" th:href="@{/onboarding/1}"><i class="bi bi-arrow-left-short"></i>Atrás</a>
        </div>
    </div>
</th:block>
</body>
</html>
