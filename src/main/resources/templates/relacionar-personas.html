<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/onboarding-layout :: commonAssets('Relacionar Personas')}"></th:block>
</head>
<body class="bg-soft onboarding-layout has-fixed-actions">
<div class="container-fluid px-2 px-md-4 py-3 py-md-4 onboarding-shell">
    <div class="row g-3 g-lg-4 align-items-start onboarding-grid">
        <aside th:replace="~{fragments/onboarding-layout :: sidebar}"></aside>

        <main class="col-12 col-lg-10 onboarding-main">
            <header th:replace="~{fragments/onboarding-layout :: topbar}"></header>
            <ul th:replace="~{fragments/onboarding-layout :: moduleTabs('relacionar-personas')}"></ul>


            <section class="card border-0 shadow-sm rounded-4 relation-window">
                <div class="card-body p-3 p-md-4">
                    <div class="row g-2 align-items-end relation-filter mb-3">
                        <div class="col-12 col-md-3">
                            <label class="form-label">Tipo Relación</label>
                            <select class="form-select form-select-sm">
                                <option value="">Todos</option>
                                <option>CONYUGE DE</option>
                                <option>CONYUGE DE FACTO DE</option>
                                <option>PADRE O MADRE DE</option>
                                <option>HIJO/A DE</option>
                                <option>HIJO/A DE</option>
                                <option>ABUELO/A DE</option>
                                <option>NIETO/A DE</option>
                                <option>HERMANO/A DE</option>
                                <option>TIO/A DE</option>
                            </select>
                        </div>
                        <div class="col-12 col-md-6">
                            <label class="form-label">Buscar persona</label>
                            <input class="form-control form-control-sm" type="text" placeholder="Id oficial o nombre">
                        </div>
                        <div class="col-12 col-md-3 d-grid">
                            <button class="btn btn-brand btn-sm" type="button"><i class="bi bi-search"></i> Buscar</button>
                        </div>
                    </div>

                    <div class="table-responsive relation-table-wrap">
                        <table class="table table-sm align-middle mb-0 relation-table click-select-table">
                            <thead>
                            <tr>
                                <th>Tipo de Relación</th>
                                <th>Id. Oficial</th>
                                <th>Nombre</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr>
                                <td>HERMANO/A DE</td>
                                <td>1581274695</td>
                                <td>RICARDO ESPINOSA RAMOS</td>
                            </tr>
                            <tr>
                                <td>CONYUGE DE</td>
                                <td>1304578894</td>
                                <td>MARIA GONZALEZ ALVAREZ</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="d-flex flex-wrap justify-content-end gap-2 mt-3">
                        <a class="btn btn-brand" th:href="@{/onboarding/relacionar-personas/nuevo}">
                            <i class="bi bi-plus-circle me-1"></i>Añadir
                        </a>

                    </div>
                </div>
            </section>
            <th:block th:replace="~{fragments/onboarding-layout :: fixedBackAction}"></th:block>
        </main>
    </div>
</div>
<script th:src="@{/js/table-pagination.js}"></script>
<script th:src="@{/js/table-row-selection.js}"></script>
</body>
</html>
